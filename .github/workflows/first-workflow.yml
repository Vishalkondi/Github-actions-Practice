
name: My First GitHub Action

on:
  push:
  workflow_dispatch:

env:
  STUDENT_NAME: Vishal
  COURSE_NAME: GitHub Actions

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Welcome message
        run: echo "Hello! My first GitHub Actions workflow is running."

      - name: Show current date
        run: date

      - name: Show repository name
        run: 'echo "Repository: $GITHUB_REPOSITORY"'

      - name: Print my name
        run: echo "Hello, Vishal! I am learning GitHub Actions."

      - name: Show environment variables
        run: |
          echo "Student: $STUDENT_NAME"
          echo "Course: $COURSE_NAME"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Workspace: $GITHUB_WORKSPACE"

      - name: Show workflow context
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
          ACTOR_NAME: ${{ github.actor }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Branch: $BRANCH_NAME"
          echo "Actor: $ACTOR_NAME"

      - name: Run only on push
        if: ${{ github.event_name == 'push' }}
        run: echo "This step runs only on a push event."

  second-job:
    runs-on: ubuntu-latest

    steps:
      - name: Report success
        run: echo "Second job completed successfully."

      - name: Show job information
        run: |
          echo "This is an independent job."
          echo "Student: $STUDENT_NAME"
          echo "Course: $COURSE_NAME"
